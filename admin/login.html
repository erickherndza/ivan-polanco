<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — Panel de citas</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="icon" type="image/png" href="../assets/img/icono.png">
</head>
<body class="admin-login-body">

<div class="admin-login-card">
  <img src="../assets/img/logo.png" alt="Dr. Iván Gilberto Polanco Grullón" class="admin-login-logo">
  <h1>Panel de citas</h1>
  <p class="hint">Acceso solo para el consultorio.</p>

  <p class="form-error" id="login-error"></p>

  <form id="login-form">
    <div class="form-field">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
    </div>
    <div class="form-field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-flat" id="login-btn">Entrar</button>
  </form>
</div>

<script src="../assets/js/admin.js"></script>
</body>
</html>
